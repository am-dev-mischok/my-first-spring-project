<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="de-DE">
<head>

    <!-- The title of the webpage that appears in the browser tab -->
    <title>Hello :-)</title>

    <!-- Specifies the character encoding for the HTML document -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>

    <!-- Sets the viewport to make the website responsive to different screen widths, especially for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Includes the Bootstrap CSS from a CDN to style the website -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Includes the Bootstrap JavaScript functions from a CDN to add interactivity and components functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Link to custom stylesheet -->
    <link th:href="@{/styles/main.css}" rel="stylesheet">
</head>
<body>
<!-- Main container with light background filling full height -->
<div class="container bg-light cover-height-full">
    <!-- This heading's text is determined by a Thymeleaf condition.
         If 'mode' is 'edit', the text will be 'Empfehlung bearbeiten' (Edit Recommendation);
         Otherwise, it will be 'Empfehlungsdetails' (Recommendation Details) -->
    <h2 th:text="${mode == 'edit' ? 'Empfehlung bearbeiten' : 'Empfehlungsdetails'}"></h2>

    <!-- This includes and replaces the content of another template fragment into this one.
         The fragment 'recommendationForm' from 'fragments/recommendationForm.html' is loaded here
         and is passed the variables 'mode', 'recommendation', and 'persons' -->
    <div th:replace="~{fragments/recommendationForm.html :: recommendationForm(${mode}, ${recommendation}, ${persons})}"></div>
</div>
</body>
</html>
