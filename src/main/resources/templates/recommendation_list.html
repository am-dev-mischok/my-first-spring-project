<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="de-DE">
<head>

    <!-- The title of the web page, displayed on the browser tab -->
    <title>Hello :-)</title>

    <!-- Sets the Content-Type of the document to HTML with UTF-8 encoding -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>

    <!-- Ensures the page is rendered in a responsive manner on all devices by setting the viewport width to the device width and the initial zoom level to 1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Links to the Bootstrap CSS for styling the webpage with Bootstrap's predefined classes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Links to the Bootstrap JavaScript bundle which includes Bootstrap's JavaScript and Popper.js required for dynamic components like modals, tooltips, etc. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Links to Bootstrap Icons for adding customizable icons to the webpage -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Link to custom stylesheet -->
    <link th:href="@{/styles/main.css}" rel="stylesheet">
</head>
<body>
<!-- Main container with light background filling full height -->
<div class="container bg-light cover-height-full">
    <header>
        <!-- Header section -->
        <h1>Alle Empfehlungen</h1>
        <div>
            <!-- Link to return to the main page -->
            <a href="/">
                Zurück zur Hauptseite
            </a>
        </div>
    </header>
    <main>
        <!-- Main content section -->
        <h2>
            Empfehlungen:
            <!-- Display the count of all recommendations -->
            <span th:text="${allRecommendations.size()}">0</span>
            Stück
        </h2>
        <!-- Table to display recommendations -->
        <table class="table table-bordered table-striped">
            <thead>
            <tr>
                <!-- Column headers -->
                <td>Details</td>
                <td>Bearbeiten</td>
                <td style="font-weight: bold">Name</td>
                <td>Bewertung</td>
                <td>Beschreibung</td>
                <td>Zielgruppe</td>
                <td>Erstelldatum</td>
                <td>Entdecker</td>
            </tr>
            </thead>
            <tbody>
            <!-- Iterate through each recommendation -->
            <tr th:each="singleRecommendation : ${allRecommendations}">
                <td class="text-center">
                    <!-- Link to recommendation details -->
                    <a th:href="'/recommendation/' + ${singleRecommendation.id}">
                        <i class="bi bi-info-circle"></i> <!-- Info icon -->
                    </a>
                </td>
                <td class="text-center">
                    <!-- Link to edit recommendation -->
                    <a th:href="'/recommendation/edit/' + ${singleRecommendation.id}">
                        <i class="bi bi-pencil-square"></i> <!-- Pencil icon -->
                    </a>
                </td>
                <td>
                    <!-- Display recommendation name as a link -->
                    <div style="font-weight: bold; max-height: 7rem; overflow: auto">
                        <a th:href="${singleRecommendation.url}" th:text="${singleRecommendation.name}">
                            name
                        </a>
                    </div>
                </td>
                <td>
                    <!-- Display recommendation rating as stars -->
                    <div class="d-flex align-items-center">
                        <!-- Filled stars based on the rating -->
                        <span th:if="${singleRecommendation.rating != 0}"
                              th:each="i: ${#numbers.sequence(1, singleRecommendation.rating)}">
                            <i class="bi bi-star-fill text-warning"></i>
                        </span>
                        <!-- Empty stars for the remaining rating -->
                        <span th:if="${singleRecommendation.rating != 10}"
                              th:each="i: ${#numbers.sequence(1, 10 - singleRecommendation.rating)}">
                            <i class="bi bi-star text-warning"></i>
                        </span>
                        <!-- Numeric rating display -->
                        <span class="ms-2" th:text="${singleRecommendation.rating} + '/10'"></span>
                    </div>
                </td>
                <td>
                    <!-- Display recommendation description with limited height -->
                    <div style="max-height: 7rem; overflow: auto" th:text="${singleRecommendation.description}"></div>
                </td>
                <td th:text="${singleRecommendation.targetGroup.label}">
                    targetGroup.label <!-- Label for target group -->
                </td>
                <td th:text="${#temporals.format(singleRecommendation.submitted, 'dd.MM.yyyy, HH:mm')}">
                    submitted <!-- Submitted date formatted -->
                </td>
                <td>
                    <!-- Display the discoverer of the recommendation, if any -->
                    <a th:unless="${singleRecommendation.discoverer == null}"
                       th:href="'/person/' + ${singleRecommendation.discoverer.id}"
                       th:text="${singleRecommendation.discoverer.name}">
                        discoverer.name
                    </a>
                    <span th:if="${singleRecommendation.discoverer == null}">
                        <!-- Display dashes if no discoverer -->
                        ---
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
        <div></div>
        <!-- Section to create a new recommendation -->
        <h2>Neue Empfehlung anlegen</h2>
        <!-- Include recommendation form fragment -->
        <div th:replace="~{fragments/recommendationForm.html :: recommendationForm(${mode}, ${recommendation}, ${persons})}"></div>
    </main>
</div>
</body>
</html>
