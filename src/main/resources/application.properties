spring.application.name=my_first_spring_project

spring.datasource.url=jdbc:h2:file:./data/mynewdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# enables hidden Methods else only Get & Post work
# More Info: https://stackoverflow.com/questions/24256051/delete-or-put-methods-in-thymeleaf/63796355#63796355
spring.mvc.hiddenmethod.filter.enabled=true

spring.thymeleaf.cache=false